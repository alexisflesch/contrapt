# Publie le build statique sur GitHub Pages, sous https://<compte>.github.io/<dépôt>/.
# Déclenché à chaque push sur main, ou à la main depuis l'onglet Actions.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Version de pnpm lue dans le champ `packageManager` de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Le site est servi sous /<dépôt>/ : Vite préfixe les assets et le
          # routeur prend ce chemin comme base (vite.config.ts, App.tsx).
          TINKERBOLT_BASE_PATH: /${{ github.event.repository.name }}/
      # Pages ne réécrit pas les URL : une route profonde (/levels/…/play,
      # /bench) rechargée tombe sur 404.html, qui est l'application elle-même.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
